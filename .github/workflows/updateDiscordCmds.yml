name: Update Discord Commands

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Update Commands
        run: node scripts/registerDiscordCommands.mjs
        env:
          appId: ${{ vars.APPID }}
          appToken: ${{ secrets.APPTOKEN }}